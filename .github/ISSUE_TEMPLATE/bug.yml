---
name: Bug report
description: Something in me[tt] doesn't work or shows the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page and screen
      description: e.g. status board on a 4K TV, player page on an iPhone, admin on a laptop.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the header of every page (e.g. v1.5.0).
  - type: textarea
    id: game
    attributes:
      label: Game situation
      description: Expert or Basic, number of empires, round and phase, if it matters.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Paste or drag a screenshot here, if you have one.
