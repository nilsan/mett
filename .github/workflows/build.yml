---
name: build

# yamllint thinks bare `on:` is a YAML 1.1 boolean; quote it to silence.
"on":
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghcr:
    name: build & push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Tags: :latest is what production pulls; :<short-sha> pins a specific commit
          # for rollback / blue-green / forensic inspection.
          tags: |
            ghcr.io/${{ github.repository_owner }}/mett:latest
            ghcr.io/${{ github.repository_owner }}/mett:${{ steps.sha.outputs.short }}
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
