---
# Pull the latest container image from ghcr.io and recreate the running
# me[tt] containers. Compose file + Caddyfile are shipped from the
# local repo via this playbook — the deploy host doesn't need a git
# checkout, only somewhere to land the two files docker compose reads.

- name: Update me[tt] containers on bf.nottseter.no
  hosts: mett
  gather_facts: false
  vars:
    deploy_path: /home/nilsan/mett
    compose_file: docker/docker-compose.yml

  tasks:
    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_path }}/docker"
        state: directory
        mode: "0755"

    - name: Ship docker-compose.yml
      ansible.builtin.copy:
        src: ../docker/docker-compose.yml
        dest: "{{ deploy_path }}/docker/docker-compose.yml"
        mode: "0644"

    - name: Ship Caddyfile
      ansible.builtin.copy:
        src: ../docker/Caddyfile
        dest: "{{ deploy_path }}/docker/Caddyfile"
        mode: "0644"
      notify: Reload caddy

    - name: Pull latest images from ghcr.io  # noqa: no-changed-when
      # Image is built + pushed by .github/workflows/build.yml on every
      # push to main. After `git push`, wait ~1-2 min for the GitHub
      # Action to finish before running deploy — verify.yml will
      # otherwise fail because the footer SHA won't match.
      ansible.builtin.command:
        chdir: "{{ deploy_path }}"
        cmd: "docker compose -f {{ compose_file }} pull"
      register: docker_pull

    - name: Recreate containers (mett services + caddy)
      ansible.builtin.command:
        chdir: "{{ deploy_path }}"
        cmd: "docker compose -f {{ compose_file }} up -d"
      register: compose_up
      changed_when: >-
        compose_up.stderr is search('Recreate') or
        compose_up.stderr is search('Started') or
        compose_up.stderr is search('Created')

    - name: Capture container status
      ansible.builtin.command:
        chdir: "{{ deploy_path }}"
        cmd: "docker compose -f {{ compose_file }} ps"
      register: compose_ps
      changed_when: false

    - name: Print container status
      ansible.builtin.debug:
        msg: "{{ compose_ps.stdout_lines }}"

  handlers:
    # Caddy doesn't watch its config file — when the Caddyfile bind-mount
    # changes on disk, we need to send caddy a reload signal for the new
    # config to take effect. `docker compose up -d` won't recreate caddy
    # unless its image changes, so this handler covers Caddyfile-only edits.
    - name: Reload caddy  # noqa: no-changed-when
      ansible.builtin.command:
        chdir: "{{ deploy_path }}"
        cmd: "docker compose -f {{ compose_file }} exec caddy caddy reload --config /etc/caddy/Caddyfile"

# Run the smoke-test playbook in a second play. Asserts only that each
# subdomain serves a 200 with a footer carrying the expected commit
# SHA — which is the single fact that proves the new image is live.
# Skip with `--skip-tags verify`.
- name: Verify deployed instances
  import_playbook: verify.yml
  tags: verify
