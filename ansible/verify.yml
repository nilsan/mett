---
# Smoke-test the deployed me[tt] instances. Asserts each subdomain
# responds 200 and the version footer carries the expected commit SHA.
# That single fact is enough to prove the right image is live — no
# need to read live game state, which would only pollute the play log.
#
# Standalone usage:
#   ansible-playbook -i inventory.ini verify.yml
#
# By default expected_sha is the local repo's HEAD short SHA — what
# build.yml would have baked into the image on push. Override:
#   ansible-playbook -i inventory.ini verify.yml -e expected_sha=abc1234

- name: Smoke-test deployed me[tt] instances
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    instances:
      - katja
      - arne
      - dag
      - me
    base_domain: example.com
    expected_sha: "{{ lookup('pipe', 'git -C ' + playbook_dir + '/.. rev-parse --short HEAD') }}"
    request_timeout: 10

  tasks:
    - name: Show expected commit SHA
      ansible.builtin.debug:
        msg: "Verifying production carries footer SHA {{ expected_sha }}"

    - name: GET / from each instance
      ansible.builtin.uri:
        url: "https://{{ item }}.{{ base_domain }}/"
        return_content: true
        timeout: "{{ request_timeout }}"
      loop: "{{ instances }}"
      register: home_responses
      changed_when: false

    - name: Assert / returns 200 and the version footer matches expected_sha
      ansible.builtin.assert:
        that:
          - item.status == 200
          - "'class=\"version-footer\"' in item.content"
          - "expected_sha in item.content"
        fail_msg: "{{ item.item }}.{{ base_domain }}: status={{ item.status }} or footer is missing SHA {{ expected_sha }}"
        success_msg: "{{ item.item }}.{{ base_domain }}: ✓ status 200, footer carries {{ expected_sha }}"
      loop: "{{ home_responses.results }}"
      loop_control:
        label: "{{ item.item }}"
