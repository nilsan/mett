# METT with Caddy reverse proxy + automatic HTTPS (Let's Encrypt)
# Usage: docker compose -f docker/docker-compose.caddy.yml up -d
# Requires: edit Caddyfile to set your domain name first

services:
  mett:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    volumes:
      - ~/docker/mett:/app/data
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/mett.db
      PORT: 3000

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - mett

volumes:
  caddy_data:
  caddy_config:
