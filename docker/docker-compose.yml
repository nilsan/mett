---
# Per-instance services share build, expose, restart, and environment
# config via the x-mett anchor. Each instance only differs in its
# data-volume mount path.
x-mett-defaults: &mett-defaults
  # Production pulls this from ghcr.io (built by .github/workflows/build.yml
  # on every push to main). The build: block is kept so `docker compose build`
  # still works for local dev — it'll build and tag with the same image name.
  image: ghcr.io/nilsan/mett:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      BUILD_SHA: ${BUILD_SHA:-}
  expose:
    - "3000"
  restart: unless-stopped
  environment:
    DATABASE_PATH: /app/data/mett.db
    PORT: 3000

services:
  mett-katja:
    <<: *mett-defaults
    volumes:
      - ~/docker/mett/katja:/app/data

  mett-arne:
    <<: *mett-defaults
    volumes:
      - ~/docker/mett/arne:/app/data

  mett-dag:
    <<: *mett-defaults
    volumes:
      - ~/docker/mett/dag:/app/data

  mett-me:
    <<: *mett-defaults
    volumes:
      - ~/docker/mett/me:/app/data

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - mett-katja
      - mett-arne
      - mett-dag
      - mett-me

volumes:
  caddy_data:
  caddy_config:
