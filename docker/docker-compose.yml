---
# Single-instance compose for me[tt]. Pulls the upstream image from
# ghcr.io (built + pushed by .github/workflows/build.yml on every
# push to main), or builds locally with `docker compose build` for
# development. Pin a specific upstream version with METT_VERSION:
#
#   docker compose pull
#   docker compose up -d
#
#   METT_VERSION=1.2.3 docker compose pull        # pin patch
#   METT_VERSION=1.2   docker compose pull        # track minor
#   METT_VERSION=1     docker compose pull        # track major
#   METT_VERSION=latest docker compose pull       # rolling (default)
#
# Multi-instance / multi-host setups: duplicate the `mett` service
# under different names, mount different volumes, and adjust the
# Caddyfile.

services:
  mett:
    image: ghcr.io/nilsan/mett:${METT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-}
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/mett.db
      PORT: 3000
    volumes:
      - mett_data:/app/data

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - mett

volumes:
  mett_data:
  caddy_data:
  caddy_config:
