services:
  mett-katja:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    volumes:
      - ~/docker/mett/katja:/app/data
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/mett.db
      PORT: 3000

  mett-arne:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    volumes:
      - ~/docker/mett/arne:/app/data
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/mett.db
      PORT: 3000

  mett-dag:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    volumes:
      - ~/docker/mett/dag:/app/data
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/mett.db
      PORT: 3000

  mett-me:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    volumes:
      - ~/docker/mett/me:/app/data
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/mett.db
      PORT: 3000

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - mett-katja
      - mett-arne
      - mett-dag
      - mett-me

volumes:
  caddy_data:
  caddy_config:
